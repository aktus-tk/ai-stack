# LiteLLM Proxy + Postgres の Docker Compose
# サーバー: ~/docker/litellm/ に配置して `docker compose up -d`
#
# 実運用前に:
#   - .env を作成し LITELLM_MASTER_KEY / LITELLM_SALT_KEY / UI_PASSWORD を
#     長いランダム値に変更
#   - image を `latest` でなくリリースタグに固定推奨
#
# モデル登録は DB 永続化 (STORE_MODEL_IN_DB=True) のため UI での追加は再起動で維持される

services:
  litellm:
    image: docker.litellm.ai/berriai/litellm-database:latest
    ports:
      - "4000:4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      UI_USERNAME: admin
      UI_PASSWORD: ${UI_PASSWORD}
      DATABASE_URL: postgresql://litellm:litellm@db:5432/litellm
      STORE_MODEL_IN_DB: "True"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm
      POSTGRES_DB: litellm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
